name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Tests
        run: |
          go test -v -race ./...

      - name: Build Cross-Platform Archives
        run: |
          mkdir -p dist
          TAG_NAME="${GITHUB_REF_NAME:-v0.0.1}"
          VERSION="${TAG_NAME#v}"
          LDFLAGS="-s -w -X 'main.version=${VERSION}'"

          targets=(
            "darwin amd64"
            "darwin arm64"
            "linux amd64"
            "linux arm64"
            "windows amd64"
            "windows arm64"
          )

          for target in "${targets[@]}"; do
            read -r os arch <<< "$target"
            bin_name="mcp-jira"
            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi

            archive_name="mcp-jira-${TAG_NAME}-${os}-${arch}"
            stage_dir="/tmp/${archive_name}"
            rm -rf "${stage_dir}"
            mkdir -p "${stage_dir}"

            echo "Building ${os}/${arch}..."
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -ldflags="${LDFLAGS}" -o "${stage_dir}/${bin_name}${ext}" .
            cp README.md LICENSE "${stage_dir}/"

            if [ "$os" = "windows" ]; then
              (cd /tmp && zip -q -r "${GITHUB_WORKSPACE}/dist/${archive_name}.zip" "${archive_name}")
            else
              tar -czf "${GITHUB_WORKSPACE}/dist/${archive_name}.tar.gz" -C /tmp "${archive_name}"
            fi
          done

          cd dist
          sha256sum * > SHA256SUMS.txt
          echo "Generated archives and checksums:"
          ls -lh

      - name: Extract Release Notes
        id: notes
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v0.0.1}"
          VERSION="${TAG_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk "/## \\[$VERSION\\]/{flag=1; next} /## \\[/{flag=0} flag" CHANGELOG.md | sed '/^$/N;/^\n$/D')
          fi
          if [ -n "$NOTES" ]; then
            echo "$NOTES" > /tmp/release_notes.md
          else
            echo "Release ${TAG_NAME}" > /tmp/release_notes.md
          fi
          cat /tmp/release_notes.md

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          body_path: /tmp/release_notes.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
